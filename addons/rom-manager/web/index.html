<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameCore games</title>
<link rel="stylesheet" href="gamecore-ui.css">
<link rel="stylesheet" href="gamecore-nav.css">
<script src="gamecore-icons.js"></script>
<script src="gamecore-nav.js" defer></script>
<style>
.rail-logo { width: 28px; height: 28px; object-fit: contain; flex-shrink: 0; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px 16px; }
.card { position: relative; display: flex; flex-direction: column; gap: 8px; }
.card-art { aspect-ratio: 3 / 4; border-radius: var(--r-card); background: var(--raised); overflow: hidden;
  display: grid; place-items: center; color: var(--ink-3); border: 1px solid var(--line); }
.card-art img { width: 100%; height: 100%; object-fit: cover; }
.card-art .ext { font-size: 20px; font-weight: 700; color: var(--ink-3); }
.card-name { font-size: 15px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.card-meta { font-size: 14px; color: var(--ink-3); }
.card-del { position: absolute; top: 8px; right: 8px; opacity: 0; background: rgba(9, 9, 15, 0.85); }
.card:hover .card-del, .card-del:focus-visible { opacity: 1; }
@media (hover: none) { .card-del { opacity: 1; } }

.drag-overlay { position: fixed; inset: 0; z-index: 100; display: none; place-items: center;
  background: rgba(9, 9, 15, 0.94); pointer-events: none; }
.drag-overlay.visible { display: grid; }
.drag-box { width: min(440px, 90vw); padding: 48px 32px; border: 2px dashed var(--accent-soft);
  border-radius: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.drag-box .icon { width: 40px; height: 40px; color: var(--accent-soft); }
.drag-title { font-size: 20px; font-weight: 700; }
.drag-sub { font-size: 16px; color: var(--ink-2); }

.toast-row { display: flex; gap: 12px; align-items: baseline; }
.toast-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.toast-state { font-size: 14px; color: var(--ink-3); }
.toast-state.ok { color: var(--ok); } .toast-state.err { color: var(--danger); }
.bar { height: 4px; border-radius: 2px; background: var(--hover); margin-top: 8px; overflow: hidden; }
.bar-fill { height: 100%; width: 0; background: var(--accent-soft); transition: width .1s; }
.bar-fill.ok { background: var(--ok); } .bar-fill.err { background: var(--danger); }

.modal { position: fixed; inset: 0; z-index: 300; display: none; place-items: center; background: rgba(0, 0, 0, 0.7); padding: 16px; }
.modal.open { display: grid; }
.modal-box { width: min(620px, 100%); max-height: 90vh; overflow-y: auto; background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 16px; }
.modal-head { display: flex; align-items: center; gap: 12px; padding: 20px 24px; border-bottom: 1px solid var(--line); }
.modal-title { font-size: 20px; font-weight: 700; flex: 1; }
.modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
.modal-foot { padding: 0 24px 20px; font-size: 14px; color: var(--ink-3); }
.slot { display: flex; gap: 16px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r-card); }
.slot.empty { border-style: dashed; }
.slot-thumb { flex: 0 0 144px; aspect-ratio: 16 / 9; border-radius: var(--r-control); background: var(--bg);
  display: grid; place-items: center; overflow: hidden; color: var(--ink-3); font-size: 14px; }
.slot-thumb img { width: 100%; height: 100%; object-fit: contain; }
.slot-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.slot-name { font-size: 16px; font-weight: 700; }
.slot-state { font-size: 14px; color: var(--ink-3); font-weight: 400; margin-left: 8px; }
.slot-state.on { color: var(--ok); }
.slot-meta { font-size: 14px; color: var(--ink-3); word-break: break-all; }
.slot-meta .warn { color: var(--warn); }
.slot-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.slot-msg { font-size: 14px; min-height: 1em; }
.slot-msg.err { color: var(--danger); } .slot-msg.ok { color: var(--ok); }
@media (max-width: 560px) { .slot { flex-direction: column; } .slot-thumb { flex-basis: auto; } }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-head">
      <div class="rail-title">Games</div>
      <div class="rail-sub" id="rail-sub">Loading</div>
    </div>
    <nav class="rail-list" id="emu-list" aria-label="Systems"><div class="spinner"></div></nav>
  </aside>
  <main class="page" id="page"><div class="spinner"></div></main>
</div>
<input type="file" id="file-input" multiple hidden onchange="handleFileInput(this)">

<div class="drag-overlay" id="drag-overlay">
  <div class="drag-box">
    <span id="drag-icon"></span>
    <div class="drag-title">Drop to add games</div>
    <div class="drag-sub" id="drag-sub">Pick a system first</div>
  </div>
</div>

<div class="modal" id="overlay-modal" role="dialog" aria-modal="true" aria-labelledby="om-title">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-title" id="om-title">Bezels</span>
      <button class="btn icon-only" id="om-close" onclick="closeOverlayModal()" aria-label="Close"></button>
    </div>
    <div class="modal-body" id="om-slots"></div>
    <div class="modal-foot" id="om-hint"></div>
  </div>
</div>

<div class="toasts" id="toasts" role="status"></div>

<script>
// The ROM API is this addon's (relative URLs: the page lives under /roms/ behind
// Caddy, or at / on the loopback port). System logos and bezel previews are core
// assets on the same origin: Caddy routes root-absolute /assets/* to the core.
// Bezel upload and delete go through this addon's /api/overlays passthrough.

let emulators = [];
let activeEmu = null;
let dragDepth = 0;
const $ = id => document.getElementById(id);
const I = (n, c) => gcIcon(n, c);
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;

async function loadEmulators() {
  try {
    const res = await fetch('api/emulators');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    emulators = await res.json();
  } catch (e) {
    $('emu-list').innerHTML = `<div class="empty error">Couldn't list the systems: ${escHtml(e.message)}</div>`;
    return;
  }
  renderRail();
}

function renderRail() {
  const total = emulators.reduce((s, e) => s + e.romCount, 0);
  $('rail-sub').textContent = `${plural(total, 'game')} on ${plural(emulators.length, 'system')}`;
  $('emu-list').innerHTML = emulators.map(e => `
    <button class="rail-item" id="emu-${e.id}" onclick="selectEmulator('${e.id}')"
            ${activeEmu && activeEmu.id === e.id ? 'aria-current="true"' : ''}>
      <img class="rail-logo" src="/${e.iconPath}" alt="" onerror="this.remove()">
      <span class="rail-name">${escHtml(e.platform)}</span>
      <span class="rail-count" id="badge-${e.id}">${e.romCount}</span>
    </button>`).join('');
}

async function selectEmulator(id) {
  activeEmu = emulators.find(e => e.id === id);
  if (!activeEmu) return;
  document.querySelectorAll('.rail-item').forEach(el => el.removeAttribute('aria-current'));
  $(`emu-${id}`)?.setAttribute('aria-current', 'true');
  history.replaceState(null, '', `?system=${encodeURIComponent(id)}`);
  // Folder-based systems (PS3 disc games) upload whole game folders.
  $('file-input').webkitdirectory = !!activeEmu.scanDirs;
  $('drag-sub').textContent = activeEmu.scanDirs
    ? `A game folder for ${activeEmu.platform}`
    : `Files for ${activeEmu.platform}: ${(activeEmu.extensions || []).join(' ')}`;
  await loadRoms(id);
}

function pageHead(count, size) {
  const meta = [plural(count, 'game')];
  if (size) meta.push(size);
  return `
    <header class="page-head">
      <div>
        <h1 class="page-title">${escHtml(activeEmu.platform)}</h1>
        <div class="page-meta">${meta.join(', ')}</div>
      </div>
      <div class="page-actions">
        <button class="btn" onclick="openOverlayModal()">${I('image','sm')}Bezels</button>
        <button class="btn primary" onclick="triggerFileInput()">${I('plus','sm')}${activeEmu.scanDirs ? 'Add a game folder' : 'Add games'}</button>
      </div>
    </header>`;
}

async function loadRoms(emuId) {
  $('page').innerHTML = '<div class="spinner"></div>';
  let roms;
  try {
    const res = await fetch(`api/roms/${emuId}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    roms = await res.json();
  } catch (e) {
    $('page').innerHTML = `<div class="page-body"><div class="empty error">Couldn't read the games: ${escHtml(e.message)}</div></div>`;
    return;
  }
  const badge = $(`badge-${emuId}`);
  if (badge) badge.textContent = roms.length;
  const body = roms.length
    ? `<div class="grid">${roms.map(r => cardHTML(emuId, r)).join('')}</div>`
    : `<div class="empty">No game here yet. Drop ${activeEmu.scanDirs ? 'a game folder' : 'files'} anywhere on this page, or use ${activeEmu.scanDirs ? 'Add a game folder' : 'Add games'}.</div>`;
  $('page').innerHTML = `${pageHead(roms.length, activeEmu.totalSize)}
    <div class="page-body"><section class="section">${body}</section>
      <section class="section">${dropZoneHTML()}</section></div>`;
}

function cardHTML(emuId, rom) {
  const art = rom.cover
    ? `<img src="api/roms/${emuId}/cover?name=${encodeURIComponent(rom.name)}" alt="" loading="lazy"
           onerror="this.outerHTML='<span class=&quot;ext&quot;>${escHtml(rom.ext)}</span>'">`
    : `<span class="ext">${escHtml(rom.ext)}</span>`;
  return `
    <div class="card">
      <div class="card-art">${art}</div>
      <div class="card-name" title="${escHtml(rom.name)}">${escHtml(rom.displayName || rom.name)}</div>
      <div class="card-meta">${escHtml(rom.ext)}, ${rom.sizeHuman}</div>
      <button class="btn danger icon-only card-del" title="Delete" aria-label="Delete ${escHtml(rom.displayName || rom.name)}"
              onclick="deleteRom('${emuId}','${escAttr(rom.name)}',this)">${I('trash','sm')}</button>
    </div>`;
}

function dropZoneHTML() {
  const dirs = !!activeEmu.scanDirs;
  const exts = dirs ? 'Game folders' : (activeEmu.extensions || []).join(' ');
  return `
    <label class="drop" id="drop-zone-inner" ondragover="dzOver(event,this)" ondragleave="dzLeave(this)" ondrop="dzDrop(event)">
      ${I('upload')}
      <span><b>Add ${dirs ? 'a game folder' : 'games'}</b>Drop ${dirs ? 'a folder' : 'files'} here or click to browse. ${escHtml(exts)}</span>
      <input type="file" multiple ${dirs ? 'webkitdirectory' : ''} onchange="handleFileInput(this)">
    </label>`;
}

async function deleteRom(emuId, filename, btn) {
  if (!confirm(`Delete "${filename}" from the box?`)) return;
  btn.disabled = true;
  const res = await fetch(`api/roms/${emuId}/${encodeURIComponent(filename)}`, {method: 'DELETE'});
  if (res.ok) {
    btn.closest('.card').remove();
    const badge = $(`badge-${emuId}`);
    if (badge) badge.textContent = Math.max(0, parseInt(badge.textContent) - 1);
    if (!document.querySelector('.grid .card')) await loadRoms(emuId);
  } else {
    btn.disabled = false;
    toast(`Couldn't delete "${filename}".`, true);
  }
}

function triggerFileInput() {
  if (!activeEmu) { toast('Pick a system first.', true); return; }
  $('file-input').click();
}

function handleFileInput(input) {
  if (!activeEmu) { toast('Pick a system first.', true); return; }
  uploadFiles(Array.from(input.files));
  input.value = '';
}

function toast(msg, err) {
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' error' : '');
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), err ? 6000 : 3500);
}

function progressToast(name) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div class="toast-row"><span class="toast-name" title="${escHtml(name)}">${escHtml(name)}</span>
    <span class="toast-state">0%</span></div><div class="bar"><div class="bar-fill"></div></div>`;
  $('toasts').appendChild(el);
  const state = el.querySelector('.toast-state'), fill = el.querySelector('.bar-fill');
  return {
    progress(pct, text) { fill.style.width = pct + '%'; state.textContent = text || pct + '%'; },
    done() { fill.style.width = '100%'; fill.classList.add('ok'); state.className = 'toast-state ok'; state.textContent = 'Done'; setTimeout(() => el.remove(), 3000); },
    fail(text) { fill.classList.add('err'); state.className = 'toast-state err'; state.textContent = text; setTimeout(() => el.remove(), 8000); },
  };
}

function uploadFiles(files) {
  if (!activeEmu || !files.length) return;
  if (activeEmu.scanDirs) {
    // Folder-based system: files come from the directory picker, which stamps
    // webkitRelativePath ("Game/PS3_GAME/…"). Group them per game.
    const entries = files.filter(f => f.webkitRelativePath).map(f => ({ file: f, relpath: f.webkitRelativePath }));
    if (!entries.length) { toast(`${activeEmu.platform} games are folders: drop the whole game folder.`, true); return; }
    for (const [game, batch] of groupByTopDir(entries)) uploadFolder(game, batch, activeEmu.id);
    return;
  }
  files.forEach(f => uploadOne(f, activeEmu.id));
}

function groupByTopDir(entries) {
  const games = new Map();
  for (const e of entries) {
    const top = e.relpath.split('/')[0];
    if (!games.has(top)) games.set(top, []);
    games.get(top).push(e);
  }
  return games;
}

function uploadOne(file, emuId) {
  const t = progressToast(file.name);
  const xhr = new XMLHttpRequest();
  const form = new FormData();
  form.append('file', file);
  xhr.upload.onprogress = e => { if (e.lengthComputable) t.progress(Math.round(e.loaded / e.total * 100)); };
  xhr.onload = () => {
    if (xhr.status === 200) { t.done(); if (activeEmu && activeEmu.id === emuId) loadRoms(emuId); }
    else t.fail('Failed');
  };
  xhr.onerror = () => t.fail('Network error');
  xhr.open('POST', `api/roms/${emuId}/upload`);
  xhr.send(form);
}

function dzOver(e, el) { e.preventDefault(); el.classList.add('hover'); }
function dzLeave(el) { el.classList.remove('hover'); }
function dzDrop(e) { e.preventDefault(); $('drop-zone-inner')?.classList.remove('hover'); handleDrop(e); }

// Folder drops (PS3-style disc games). webkitGetAsEntry() only works inside the
// drop event itself, so the entries are grabbed here and walked afterwards.
function handleDrop(e) {
  if (!activeEmu) { toast('Pick a system first.', true); return; }
  if (!activeEmu.scanDirs) { uploadFiles(Array.from(e.dataTransfer.files)); return; }
  const entries = Array.from(e.dataTransfer.items || []).map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const dirs = entries.filter(en => en.isDirectory);
  if (!dirs.length) { toast(`${activeEmu.platform} games are folders: drop the whole game folder.`, true); return; }
  dirs.forEach(dir => uploadDroppedDir(dir, activeEmu.id));
}

async function uploadDroppedDir(dirEntry, emuId) {
  const collected = [];
  try { await collectDirEntry(dirEntry, dirEntry.name, collected); }
  catch (err) { toast(`Couldn't read "${dirEntry.name}": ${err.message || err}`, true); return; }
  if (!collected.length) { toast(`"${dirEntry.name}" is empty.`, true); return; }
  uploadFolder(dirEntry.name, collected, emuId);
}

function readAllEntries(reader) {
  // readEntries returns at most ~100 entries per call: drain it.
  return new Promise((resolve, reject) => {
    const all = [];
    (function next() {
      reader.readEntries(batch => { if (!batch.length) return resolve(all); all.push(...batch); next(); }, reject);
    })();
  });
}

async function collectDirEntry(entry, path, out) {
  if (entry.isFile) {
    const file = await new Promise((res, rej) => entry.file(res, rej));
    out.push({ file, relpath: path });
  } else if (entry.isDirectory) {
    const children = await readAllEntries(entry.createReader());
    for (const c of children) await collectDirEntry(c, path + '/' + c.name, out);
  }
}

// One toast per game folder, progress summed over its files.
async function uploadFolder(gameName, entries, emuId) {
  const t = progressToast(gameName);
  const total = entries.reduce((s, x) => s + x.file.size, 0);
  let doneBytes = 0;
  for (let i = 0; i < entries.length; i++) {
    const { file, relpath } = entries[i];
    try {
      await uploadEntry(file, relpath, emuId, i === entries.length - 1, loaded => {
        const pct = total ? Math.min(100, Math.round((doneBytes + loaded) / total * 100)) : 0;
        t.progress(pct, `${pct}%, file ${i + 1} of ${entries.length}`);
      });
    } catch (err) {
      t.fail(`Failed: ${String(err.message || err).slice(0, 60)}`);
      return;
    }
    doneBytes += file.size;
  }
  t.done();
  if (activeEmu && activeEmu.id === emuId) loadRoms(emuId);
}

function uploadEntry(file, relpath, emuId, isLast, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    const form = new FormData();
    form.append('file', file);
    form.append('relpath', relpath);
    form.append('last', isLast ? '1' : '0');
    xhr.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded); };
    xhr.onload = () => {
      if (xhr.status === 200) return resolve();
      let msg = `HTTP ${xhr.status}`;
      try { msg = JSON.parse(xhr.responseText).detail || msg; } catch {}
      reject(new Error(msg));
    };
    xhr.onerror = () => reject(new Error('network error'));
    xhr.open('POST', `api/roms/${emuId}/upload-entry`);
    xhr.send(form);
  });
}

document.addEventListener('dragenter', e => {
  if (!e.dataTransfer.types.includes('Files')) return;
  dragDepth++;
  $('drag-overlay').classList.add('visible');
});
document.addEventListener('dragleave', () => {
  dragDepth--;
  if (dragDepth <= 0) { dragDepth = 0; $('drag-overlay').classList.remove('visible'); }
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  $('drag-overlay').classList.remove('visible');
  const hasFiles = e.dataTransfer.files.length || Array.from(e.dataTransfer.items || []).some(i => i.kind === 'file');
  if (hasFiles) handleDrop(e);
});

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// Values inside single-quoted JS strings in inline handlers: JS-escape
// backslashes and quotes first, then HTML-escape.
function escAttr(s) { return escHtml(String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")); }

// ── Bezels ──────────────────────────────────────────────────────────────────
// One card per bezel slot: an emulator can run several machines (mGBA: Game Boy,
// Color, Advance) and each may have its own frame. Empty slots are drawn too, so a
// silent success and a silent failure look different. Everything goes through this
// addon's /api/overlays passthrough; the core owns assets/overlays (api: 1).

function openOverlayModal() {
  if (!activeEmu) return;
  $('om-title').textContent = `Bezels for ${activeEmu.platform}`;
  $('overlay-modal').classList.add('open');
  omLoadSlots();
}

function closeOverlayModal() { $('overlay-modal').classList.remove('open'); }

async function omLoadSlots() {
  const box = $('om-slots');
  box.innerHTML = '<div class="empty">Reading</div>';
  $('om-hint').textContent = '';
  let slots, note = '';
  try {
    const res = await fetch(`api/overlays/${encodeURIComponent(activeEmu.id)}/slots`);
    if (!res.ok) throw new Error(await omDetail(res));
    const body = await res.json();
    slots = body.slots || [];
    note = body.note || '';
  } catch (e) {
    box.innerHTML = '';
    $('om-hint').textContent = String(e.message || e);
    return;
  }
  box.innerHTML = slots.map(omSlotCard).join('');
  // Only when there is something to explain: a core older than per-console
  // bezels shows one slot where another box shows four.
  $('om-hint').textContent = note || (slots.length > 1
    ? `${activeEmu.platform} runs ${slots.length - 1} consoles; each can have its own frame.` : '');
}

/** The core answers a refusal with a sentence; a generic "failed" wastes it. */
async function omDetail(res) {
  try { const body = await res.json(); if (body && body.detail) return body.detail; } catch {}
  return `Request failed (${res.status})`;
}

function omSlotCard(s) {
  const key = s.console || '';
  const id = `om-slot-${key || 'system'}`;
  const thumb = s.present
    ? `<img src="/assets/overlays/${encodeURIComponent(s.filename)}?t=${Date.now()}" alt="">`
    : 'No bezel';
  const state = s.level === 'system'
    ? `<span class="slot-state">Every ${escHtml(activeEmu.platform)} game</span>`
    : `<span class="slot-state ${s.present ? 'on' : ''}">${s.present ? 'In place' : 'Not set'}</span>`;
  // The measured hole, because the ratio is what a frame can be wrong about: a 1:1
  // frame over a 3:2 console covers the game's edges. Compared here, at upload time.
  const bad = s.present && ratioMismatch(s.ratio, s.expected_ratio);
  const meta = s.present
    ? `${escHtml(s.filename)}, hole ${s.hole.w}×${s.hole.h} (${escHtml(s.ratio)})`
      + (s.expected_ratio
         ? (bad ? ` <span class="warn">The ${escHtml(s.label)} draws ${escHtml(s.expected_ratio)}: this frame will cover part of the game.</span>`
                : `, matches the machine`)
         : '')
    : `${escHtml(s.filename)}${s.expected_ratio ? `, the machine draws ${escHtml(s.expected_ratio)}` : ''}`;
  const remove = s.present
    ? `<button class="btn danger" onclick="${s.level === 'console' ? `omRemoveConsole('${escAttr(s.console)}')` : 'omRemoveSystem()'}">${I('trash','sm')}Remove</button>`
    : '';
  return `<div class="slot ${s.present ? '' : 'empty'}" id="${id}">
    <div class="slot-thumb">${thumb}</div>
    <div class="slot-main">
      <div class="slot-name">${escHtml(s.label)}${state}</div>
      <div class="slot-meta">${meta}</div>
      <div class="slot-actions">
        <label class="btn" ondragover="omDzOver(event,this)" ondragleave="omDzLeave(this)" ondrop="omDzDrop(event,this,'${escAttr(key)}')">
          ${I('upload','sm')}${s.present ? 'Replace' : 'Add a PNG'}
          <input type="file" accept="image/png,image/jpeg,image/webp" onchange="omFileInput(this,'${escAttr(key)}')">
        </label>
        ${remove}
      </div>
      <div class="slot-msg" id="${id}-msg"></div>
    </div>
  </div>`;
}

/** "809:540" vs "3:2": compare values, with the 1.5 % slack of a one-pixel rounding. */
function ratioMismatch(measured, expected) {
  if (!measured || !expected) return false;
  const val = r => { const [w, h] = String(r).split(':').map(Number); return w > 0 && h > 0 ? w / h : NaN; };
  const a = val(measured), b = val(expected);
  if (!isFinite(a) || !isFinite(b)) return false;
  return Math.abs(a / b - 1) > 0.015;
}

function omMsg(consoleId, text, kind) {
  const el = $(`om-slot-${consoleId || 'system'}-msg`);
  if (el) { el.textContent = text; el.className = `slot-msg ${kind || ''}`; }
}
function omDzOver(e, el) { e.preventDefault(); el.classList.add('hover'); }
function omDzLeave(el) { el.classList.remove('hover'); }
function omDzDrop(e, el, consoleId) {
  e.preventDefault(); e.stopPropagation();
  el.classList.remove('hover');
  const file = e.dataTransfer.files[0];
  if (file) omUpload(file, consoleId);
}
function omFileInput(input, consoleId) { const file = input.files[0]; if (file) omUpload(file, consoleId); input.value = ''; }

async function omUpload(file, consoleId) {
  omMsg(consoleId, 'Uploading', '');
  const form = new FormData();
  form.append('file', file);
  const url = consoleId
    ? `api/overlays/${encodeURIComponent(activeEmu.id)}/consoles/${encodeURIComponent(consoleId)}`
    : `api/overlays/${encodeURIComponent(activeEmu.id)}`;
  let res;
  try { res = await fetch(url, { method: 'POST', body: form }); }
  catch { omMsg(consoleId, "Couldn't reach the box.", 'err'); return; }
  // A 422 says a bezel needs a transparent area for the game to show through.
  if (!res.ok) { omMsg(consoleId, await omDetail(res), 'err'); return; }
  omMsg(consoleId, 'Saved.', 'ok');
  omLoadSlots();
}

async function omRemoveConsole(consoleId) {
  if (!confirm('Remove this console’s bezel? Its games fall back to the system one.')) return;
  const res = await fetch(`api/overlays/${encodeURIComponent(activeEmu.id)}/consoles/${encodeURIComponent(consoleId)}`, { method: 'DELETE' });
  if (res.ok) omLoadSlots(); else omMsg(consoleId, await omDetail(res), 'err');
}

async function omRemoveSystem() {
  if (!confirm('Remove the bezel for this system?')) return;
  const res = await fetch(`api/overlays/${encodeURIComponent(activeEmu.id)}`, { method: 'DELETE' });
  if (res.ok) omLoadSlots(); else omMsg('', await omDetail(res), 'err');
}

$('drag-icon').innerHTML = I('upload');
$('om-close').innerHTML = I('close', 'sm');
$('overlay-modal').addEventListener('click', e => { if (e.target === $('overlay-modal')) closeOverlayModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlayModal(); });

// Open straight on a system: the one in the URL, else the first with games.
loadEmulators().then(() => {
  const q = new URLSearchParams(location.search).get('system');
  const first = emulators.find(e => e.id === q) || emulators.find(e => e.romCount) || emulators[0];
  if (first) selectEmulator(first.id);
  else $('page').innerHTML = '<div class="page-body"><div class="empty">No system on this box yet.</div></div>';
});
</script>
